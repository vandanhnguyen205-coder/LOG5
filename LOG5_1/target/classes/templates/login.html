<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - Logistics Cold Chain LOG-05</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-sky-400 text-center mb-2"> LOGISTICS LOG-05</h2>
        <p class="text-slate-400 text-xs text-center mb-6">Hệ thống Quản lý Vận chuyển Hàng Đặc Biệt</p>

        <div th:if="${error}" class="bg-red-500/20 border border-red-500 text-red-300 p-3 rounded text-sm mb-4" th:text="${error}"></div>
        <div th:if="${success}" class="bg-emerald-500/20 border border-emerald-500 text-emerald-300 p-3 rounded text-sm mb-4" th:text="${success}"></div>

        <form action="/login" method="post" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-300 mb-1">Email</label>
                <input type="email" name="email" required placeholder="tuan.hoang@logistics.com" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Mật khẩu</label>
                <input type="password" name="password" required placeholder="Mật khẩu từng vai trò" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-sky-500">
            </div>
            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded transition">Đăng Nhập</button>
        </form>

        <!-- <div class="mt-4 p-3 bg-slate-900/60 rounded border border-slate-700 text-xs space-y-1 text-slate-300">

            <div>• Kiểm Duyệt: cuong.le@logistics.com / <span class="text-emerald-400 font-mono">cuongPass789</span></div>

        <div class="mt-4 border-t border-slate-700 pt-3 text-center">
            <p class="text-xs text-slate-400">Chưa có tài khoản? <a href="/register" class="text-sky-400 font-bold hover:underline">Đăng ký khách mới</a></p>
        </div>
    </div>
</body>
</html>
