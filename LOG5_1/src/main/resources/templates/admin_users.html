<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Người Dùng & Phân Quyền - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
            <div>
                <h1 class="text-2xl font-bold text-red-500">QUẢN TRỊ HỆ THỐNG - PHÂN QUYỀN</h1>
                <p class="text-xs text-slate-400">Đang đăng nhập: <span class="text-sky-400 font-bold" th:text="${currentUser.hoTen}"></span> (<span th:text="${currentUser.email}"></span>)</p>
            </div>
            <div class="space-x-2">
                <a href="/" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-4 py-2 rounded"> Quay về Bảng Điều Khiển</a>
                <a href="/logout" class="bg-red-600 hover:bg-red-500 text-white text-xs px-4 py-2 rounded">Đăng Xuất</a>
            </div>
        </div>

        <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
            <h2 class="text-lg font-bold text-sky-400 mb-4">Danh Sách Tài Khoản Người Dùng</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900 text-slate-400 text-xs uppercase">
                        <tr>
                            <th class="p-3">ID</th>
                            <th class="p-3">Họ và Tên</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">Vai Trò Hiện Tại</th>
                            <th class="p-3">Thay Đổi Phân Quyền</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700">
                        <tr th:each="u : ${users}">
                            <td class="p-3 font-mono text-sky-400" th:text="${u.id}"></td>
                            <td class="p-3 font-semibold" th:text="${u.hoTen}"></td>
                            <td class="p-3 text-slate-400" th:text="${u.email}"></td>
                            <td class="p-3">
                                <span class="px-2.5 py-1 rounded text-xs font-bold text-white" th:style="'background-color:' + ${u.bg}" th:text="${u.label}"></span>
                            </td>
                            <td class="p-3">
                                <form action="/admin/users/update-role" method="post" class="flex gap-2">
                                    <input type="hidden" name="userId" th:value="${u.id}">
                                    <select name="newRole" class="bg-slate-900 border border-slate-700 rounded text-xs p-1.5 text-white focus:outline-none">
                                        <option value="NGUOI_GUI_HANG" th:selected="${u.vaiTro == 'NGUOI_GUI_HANG'}">Chủ Hàng</option>
                                        <option value="KIEM_DUYET_CHUNG_TU" th:selected="${u.vaiTro == 'KIEM_DUYET_CHUNG_TU'}">Kiểm Duyệt Chứng Từ</option>
                                        <option value="DIEU_PHOI_VIEN" th:selected="${u.vaiTro == 'DIEU_PHOI_VIEN'}">Điều Phối Viên</option>
                                        <option value="TAI_XE_VAN_CHUYEN" th:selected="${u.vaiTro == 'TAI_XE_VAN_CHUYEN'}">Tài Xế Vận Chuyển</option>
                                        <option value="QUAN_TRI_HE_THONG" th:selected="${u.vaiTro == 'QUAN_TRI_HE_THONG'}">Quản Trị Hệ Thống</option>
                                    </select>
                                    <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded">Lưu Quyền</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
