<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản Khách Mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-sky-400 text-center mb-2"> ĐĂNG KÝ TÀI KHOẢN</h2>
        <p class="text-slate-400 text-xs text-center mb-6">Đăng ký tài khoản Chủ Hàng mới vào hệ thống</p>

        <div th:if="${error}" class="bg-red-500/20 border border-red-500 text-red-300 p-3 rounded text-sm mb-4" th:text="${error}"></div>

        <form action="/register" method="post" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-300 mb-1">Họ và Tên</label>
                <input type="text" name="hoTen" required placeholder="Nguyễn Văn A" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Email đăng ký</label>
                <input type="email" name="email" required placeholder="khachhang@domain.com" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Mật khẩu</label>
                <input type="password" name="password" required placeholder="Tạo mật khẩu" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-sky-500">
            </div>
            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded transition">Đăng Ký Ngay</button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-700 text-center">
            <p class="text-xs text-slate-400">Đã có tài khoản? <a href="/login" class="text-sky-400 font-bold hover:underline">Đăng nhập</a></p>
        </div>
    </div>
</body>
</html>
